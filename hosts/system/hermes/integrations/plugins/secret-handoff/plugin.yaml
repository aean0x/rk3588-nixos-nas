name: secret-handoff
version: 0.1.0
description: >-
  Ephemeral login paste: request_secret pops stock clarify, intercepts the
  reply before persistence, injects via a direct CDP websocket, and never
  stores the secret on disk or in the transcript.
author: aean0x
kind: standalone
provides_tools:
  - request_secret
provides_hooks:
  - pre_gateway_dispatch
