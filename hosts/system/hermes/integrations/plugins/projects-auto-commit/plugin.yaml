name: projects-auto-commit
version: 0.1.0
description: >-
  End-of-turn blanket git commit (+ push) for the projects monorepo when the
  working tree is dirty. Keeps registry ticks and RH sessions from spending
  tokens on git while still versioning rh-agentic and registry projects.
author: aean0x
kind: standalone
provides_hooks:
  - post_llm_call
  - on_session_end
