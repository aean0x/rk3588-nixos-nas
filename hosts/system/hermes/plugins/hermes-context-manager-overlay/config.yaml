# Managed by NixOS (hosts/system/hermes/context-manager.nix + HMC overlay).
# Upstream pin: entrepeneur4lyf/hermes-context-manager@3f775efd48e878679e8fd4290b96968880fed6f7
# Restart gateway after deploy for changes to take effect.

enabled: true
debug: false

manual_mode:
  enabled: false
  automatic_strategies: true

compress:
  max_context_tokens: 120000
  max_context_percent: 0.24
  min_context_percent: 0.24
  protected_tools:
    - write_file
    - patch

strategies:
  deduplication:
    enabled: true
    protected_tools: []
  purge_errors:
    enabled: true
    turns: 4
    protected_tools: []

short_circuits:
  enabled: true

truncation:
  enabled: true
  max_lines: 40
  head_lines: 12
  tail_lines: 8
  min_content_length: 500

background_compression:
  enabled: true
  protect_recent_turns: 3

analytics:
  enabled: true
  retention_days: 90

code_filter:
  enabled: true
  min_lines: 30
  preserve_docstrings: true
