# Nix-only repo. Python/JS live in hermes-pnp; do not add empty ruff/oxlint
# jobs here. `lint` is the single branch-protection check.
name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    name: nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#statix -- check .

  lint:
    name: lint
    if: always()
    needs: [nix]
    runs-on: ubuntu-latest
    steps:
      - name: Nix gate passed
        run: |
          set -euo pipefail
          test "${{ needs.nix.result }}" = success
      - uses: actions/checkout@v4
      # The declaration invariants (compression.threshold_tokens cap, module
      # layout, mcp-proxy wiring) were previously asserted only by a documented
      # pre-deploy step, so a rushed PR could drift them. The script computes
      # its own root from BASH_SOURCE and exits non-zero on any FAIL.
      - name: Alignment checks
        run: bash scripts/check-alignment.sh
